name: Claude Code Review

permissions:
  contents: read

on:
  pull_request:
    types: [opened, ready_for_review]   # 去掉 synchronize：每 PR 评一次，不随每 push 重跑

jobs:
  claude-review:
    # author 门控：只评 owner 自己的 PR（防 prompt injection + 省 OAuth 额度）
    if: github.event.pull_request.user.login == 'linqibin0826'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write    # 修复：原 read 发不了 review 评论（静默失败）
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@593d7a5c4e0073569f74772c2b7b64c30ec14707 # v1.0.141
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          use_sticky_comment: true        # 同一 PR 复用一条评论，不堆叠
          claude_args: '--max-turns 8'    # 限深控额度
