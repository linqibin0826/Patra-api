name: CD

# 持续部署：merge 到 main（或手动触发）→ 构建 registry 镜像推 GHCR
#          → self-hosted runner 部署到 Mac mini。
# 安全：只监听 push:main 与 workflow_dispatch，不监听 pull_request，
#       保证 self-hosted runner 永不执行未经审查的 fork PR 代码。
on:
  push:
    branches: [main]
    paths:
      - 'patra-api/patra-registry/**'
      - 'patra-infra/docker/docker-compose.apps.yaml'
      - 'patra-infra/docker/.env.apps'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像 tag（留空=构建并部署本次 commit；回滚时填旧 sha）'
        required: false
        default: ''

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/linqibin0826/patra-registry

jobs:
  build-and-push:
    name: build-and-push
    # 回滚（指定了 image_tag）时跳过构建，直接部署 GHCR 已有镜像
    if: github.event_name == 'push' || github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ☕ Setup JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: 🔨 Build bootJar
        run: ./gradlew :patra-api:patra-registry:patra-registry-boot:bootJar

      - name: 🔑 Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 🐳 Build & push image
        run: |
          TAG="${{ github.sha }}"
          CTX="patra-api/patra-registry/patra-registry-boot"
          docker build -t "$IMAGE_NAME:$TAG" -t "$IMAGE_NAME:latest" "$CTX"
          docker push "$IMAGE_NAME:$TAG"
          docker push "$IMAGE_NAME:latest"

  deploy:
    name: deploy
    needs: build-and-push
    # 回滚（build 被跳过）时仍部署；仅当 build 失败才不部署
    # 正常部署 build 成功（success）；回滚跳过 build（skipped）。failure/cancelled 都不部署。
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: [self-hosted, macmini]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      # macOS self-hosted runner：docker login 默认走钥匙串(osxkeychain)，launchd 非交互会话
      # 无法解锁钥匙串（error -25308）；且 config 无 credsStore 时 docker 在 macOS 仍 fallback 钥匙串。
      # 故不调 docker login，改为直接把凭据 base64 写入 DOCKER_CONFIG/config.json 的 auths 字段，
      # docker compose pull 读 auths 认证、完全绕过钥匙串。
      DOCKER_CONFIG: ${{ runner.temp }}/patra-docker-cfg
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🔑 配置 GHCR 凭据（写 auths，绕过 macOS 钥匙串）
        run: |
          mkdir -p "$DOCKER_CONFIG"
          AUTH=$(printf '%s' "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$DOCKER_CONFIG/config.json"

      - name: 🚀 Deploy to Mac mini (OrbStack)
        run: |
          export REGISTRY_IMAGE_TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "部署镜像 tag: $REGISTRY_IMAGE_TAG"
          cd patra-infra/docker
          # Mac mini 出站偶发 tls 抖动，pull 加重试韧性
          ok=0
          for i in 1 2 3; do
            if docker compose -f docker-compose.apps.yaml pull registry; then ok=1; break; fi
            echo "pull 失败（网络抖动？），重试 $i/3..."; sleep 10
          done
          [ "$ok" = 1 ] || { echo "✗ 镜像 pull 3 次均失败"; exit 1; }
          docker compose -f docker-compose.apps.yaml up -d registry

      - name: 🩺 Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:6000/actuator/health | grep -q '"status":"UP"'; then
              echo "✓ registry 健康 (UP)"
              exit 0
            fi
            echo "等待 registry 健康... ($i/30)"
            sleep 5
          done
          echo "✗ registry 健康检查超时，最近日志："
          docker logs patra-registry --tail 100
          exit 1
