name: CI

# 统一编排：detect-changes → preflight + backend(单元 matrix) + portal + coverage → required-check
# required-check 是分支保护唯一 required check（名称勿改）。docs-only/portal-only 下后端 skipped，
# 由 allowed-skips 让 gate 仍绿。nightly(schedule) 跑全量 + portal e2e 阻塞。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'   # 每日 UTC 18:00 全量兜底 + 喂缓存
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  POSTGRES_IMAGE: postgres:17
  ROCKETMQ_IMAGE: apache/rocketmq:5.3.1

jobs:
  # ---- 1) 受影响单元路由 ----
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_units: ${{ steps.detect.outputs.backend_units }}
      portal_changed: ${{ steps.detect.outputs.portal_changed }}
      learn_changed: ${{ steps.detect.outputs.learn_changed }}
      coverage_mode: ${{ steps.detect.outputs.coverage_mode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔍 Detect affected units
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) R=$(bash patra-infra/cd/detect-changes.sh pr "$PR_BASE" "$PR_HEAD") ;;
            push)         R=$(bash patra-infra/cd/detect-changes.sh push "$PUSH_BEFORE" "$PUSH_AFTER") ;;
            *)            R=$(bash patra-infra/cd/detect-changes.sh schedule) ;;
          esac
          echo "受影响单元: $R"
          {
            echo "backend_units=$(echo "$R" | jq -c '.backend_units')"
            echo "portal_changed=$(echo "$R" | jq -r '.portal_changed')"
            echo "learn_changed=$(echo "$R" | jq -r '.learn_changed')"
            echo "coverage_mode=$(echo "$R" | jq -r '.coverage_mode')"
          } >> "$GITHUB_OUTPUT"

  # ---- 2) preflight：cheap governance（常驻跑）----
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: 🔍 Verify container image versions consistency
        run: |
          set -e
          FAIL=0
          PG_FILE="linqibin-commons/linqibin-spring-boot-starter-test/src/main/java/dev/linqibin/starter/test/container/initializer/PostgreSQLContainerInitializer.java"
          if ! grep -Fq "private static final String POSTGRESQL_IMAGE = \"$POSTGRES_IMAGE\";" "$PG_FILE"; then
            echo "::error file=$PG_FILE::POSTGRESQL_IMAGE 常量与 workflow env POSTGRES_IMAGE=$POSTGRES_IMAGE 不一致"
            FAIL=1
          fi
          for COMPOSE in \
            "linqibin-commons/linqibin-spring-boot-starter-test/src/main/resources/docker-compose-rocketmq.yml" \
            "patra-api/patra-ingest/patra-ingest-boot/src/test/resources/docker-compose-rocketmq.yml"; do
            COUNT=$(grep -F -c "image: $ROCKETMQ_IMAGE" "$COMPOSE" || true)
            if [ "$COUNT" -ne 2 ]; then
              echo "::error file=$COMPOSE::期望 2 处 'image: $ROCKETMQ_IMAGE',实际 $COUNT 处"
              FAIL=1
            fi
          done
          [ "$FAIL" -ne 0 ] && { echo "镜像版本治理 SSOT 失守"; exit 1; }
          echo "✓ 镜像版本一致"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: 🧭 Verify module-graph.json up to date
        run: |
          ./gradlew dumpModuleGraph -q
          if ! git diff --quiet patra-infra/cd/module-graph.json; then
            echo "::error::module-graph.json 陈旧。本地跑 ./gradlew dumpModuleGraph 并提交。"
            git --no-pager diff patra-infra/cd/module-graph.json
            exit 1
          fi
          echo "✓ module-graph.json 与依赖图一致"

  # ---- 3) backend：受影响单元 matrix（unit/slice/integration/e2e）----
  backend:
    name: backend (${{ matrix.unit }})
    needs: detect-changes
    if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.backend_units != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.detect-changes.outputs.backend_units) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: 🧮 Compute gradle tasks for unit
        id: tasks
        run: |
          LIST=$(jq -r --arg u "${{ matrix.unit }}" \
            '[.modules[] | select(.unit == $u) | .project as $p | .tasks[] | "\($p):\(.)"] | join(" ")' \
            patra-infra/cd/module-graph.json)
          [ -n "$LIST" ] || { echo "::error::单元 ${{ matrix.unit }} 在 module-graph.json 中无任务,检查 dumpModuleGraph"; exit 1; }
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "单元 ${{ matrix.unit }} 任务: $LIST"
      - name: 🐳 Pre-pull container images
        if: contains(steps.tasks.outputs.list, 'integrationTest') || contains(steps.tasks.outputs.list, 'e2eTest')
        run: |
          docker pull "$POSTGRES_IMAGE" & pid_pg=$!
          docker pull "$ROCKETMQ_IMAGE" & pid_mq=$!
          wait "$pid_pg"; wait "$pid_mq"
      - name: ✅ Test unit (check + integrationTest + e2eTest)
        run: ./gradlew ${{ steps.tasks.outputs.list }} -x jacocoTestReport -x integrationTestCodeCoverageReport
      - name: 📦 Upload jacoco exec (${{ matrix.unit }})
        if: always() && needs.detect-changes.outputs.coverage_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-exec-${{ matrix.unit }}
          path: |
            **/build/jacoco/test.exec
            **/build/jacoco/integrationTest.exec
          retention-days: 7
          if-no-files-found: warn
      - name: 📦 Upload reports (${{ matrix.unit }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-${{ matrix.unit }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # ---- 4) portal：仅 portal 变更时（合并原 4 job 为 1，e2e 非阻塞）----
  portal:
    name: portal
    needs: detect-changes
    if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.portal_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: patra-portal
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: 'patra-portal/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: patra-portal/pnpm-lock.yaml
      - name: 📦 Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: patra-portal/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('patra-portal/pnpm-lock.yaml') }}-${{ hashFiles('patra-portal/**/*.ts', 'patra-portal/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('patra-portal/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: 🔍 Lint (Biome)
        run: pnpm lint
      - name: 🔎 Type check
        run: pnpm typecheck
      - name: 🧪 Unit test (Vitest)
        run: pnpm test
      - name: 🎭 Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: 🧪 E2E (Playwright; PR 非阻塞 / nightly 阻塞)
        run: pnpm test:e2e
        continue-on-error: ${{ github.event_name != 'schedule' }}
      - name: 📦 Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: patra-portal/playwright-report/
          retention-days: 7

  # ---- 4b) learn：仅 learn 变更时（纯静态学习站；e2e 只在本地跑，CI 不跑）----
  learn:
    name: learn
    needs: detect-changes
    if: needs.detect-changes.result == 'success' && needs.detect-changes.outputs.learn_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: patra-learn
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: 'patra-learn/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: patra-learn/pnpm-lock.yaml
      - name: 📦 Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: patra-learn/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('patra-learn/pnpm-lock.yaml') }}-${{ hashFiles('patra-learn/**/*.ts', 'patra-learn/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('patra-learn/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: 🔍 Lint (Biome)
        run: pnpm lint
      - name: 🔎 Type check
        run: pnpm typecheck
      - name: 🧪 Unit test (Vitest)
        run: pnpm test
      - name: 🏗 Build (Next.js SSG)
        run: pnpm build

  # ---- 5) coverage：仅全量（full_run/nightly）聚合上传，服务级 PR 不伪装全仓 ----
  coverage:
    name: coverage
    needs: [detect-changes, backend]
    if: always() && needs.detect-changes.outputs.coverage_mode == 'full' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jacoco-exec-*
          merge-multiple: true
          path: .
      - name: 📊 Aggregate JaCoCo
        run: ./gradlew testCodeCoverageReport integrationTestCodeCoverageReport -x test -x integrationTest
      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml,build/reports/jacoco/integrationTestCodeCoverageReport/integrationTestCodeCoverageReport.xml
          fail_ci_if_error: true

  # ---- 6) required-check：唯一 required（分支保护认这个名）----
  required-check:
    name: required-check
    needs: [detect-changes, preflight, backend, portal, learn, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ✓ All required checks passed (skipped 视为通过)
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: backend, portal, learn, coverage
