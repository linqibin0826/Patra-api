version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: npm          # 含 pnpm（Dependabot 经 npm ecosystem 支持 pnpm-lock）
    directory: "/patra-portal"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
