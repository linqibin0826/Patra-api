# Gradle 远程构建缓存节点（patra-buildcache project）。Mac mini 上跑。
# 凭据走 .env.buildcache.secret（被 .gitignore 的 .env.*.secret 挡住，绝不进仓库）。
# 启用：scripts/compose-all.sh 纳入 patra-buildcache；CI 侧注入 GRADLE_REMOTE_CACHE_URL/凭据为网络修复后跟进。
name: patra-buildcache

services:
  gradle-build-cache:
    image: gradle/build-cache-node:18
    container_name: patra-gradle-build-cache
    restart: unless-stopped
    ports:
      - "5071:5071"
    env_file:
      - .env.buildcache.secret   # BUILD_CACHE_USERNAME / BUILD_CACHE_PASSWORD（authenticated write）
    volumes:
      - ${PATRA_DOCKER_ROOT:-${HOME}/.patra/docker}/gradle-build-cache:/data

networks:
  default:
    name: patra-net
    external: true
