# ========================================
# Production Environment Configuration
# ========================================
# 当 spring.profiles.active=prod 时生效。所有敏感/环境相关值经环境变量注入。
# object-storage 在 boot 层仅需 datasource + Nacos（Nacos 在 application.yml 已外部化）。
# 无 Redis 依赖；MinIO 客户端（若启用）为运行时懒加载，不在启动期连接。
spring:
  config:
    activate:
      on-profile: container

  # 生产数据库（凭据从环境变量注入，无默认值 → 强制由 .env 提供）
  datasource:
    url: ${STORAGE_DB_URL}
    username: ${STORAGE_DB_USERNAME}
    password: ${STORAGE_DB_PASSWORD}
